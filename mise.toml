min_version = "2026.7.13"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
task.output = "keep-order"

[tools]
node = "24.15.0"
fnox = "1.33.1"
"aqua:rvben/rumdl" = "0.1.0"
"npm:@commitlint/config-conventional" = "19.6.0"
"npm:@commitlint/cli" = "19.6.0"
"npm:@commitlint/types" = "19.5.0"
"npm:skills" = "1.5.24"
"cargo:sd" = "1.0.0"
fd = "10.4.2"
shellcheck = "0.11.0"

[hooks]
postinstall = { task = "git:install-hooks" }

[tasks."check"]
depends = ["lint"]

[tasks."lint"]
depends = ["lint:shell", "lint:docs"]

[tasks."lint:shell"]
run = """
fd --type f --extension sh --extension bash --extension zsh . . .mise/tasks --exec-batch shellcheck --shell bash
for file in ./*; do
  case "$file" in
    *.sh)
      if [ -f "$file" ]; then
        shellcheck --shell bash "$file"
      fi
      ;;
  esac
done
"""

[tasks."lint:docs"]
run = "rumdl check"

[tasks."pre-commit"]
alias = "pre-merge-commit"
run = [{ task = "git:validate-commit" }]

[tasks."commit-msg"]
run = 'mise run --output interleave commitlint -- --edit "$@"'

[tasks."fix"]
depends = ["fix:docs"]

[tasks."fix:docs"]
run = "rumdl check --fix"

[tasks."commitlint"]
run = "commitlint --extends \"$(mise where npm:@commitlint/config-conventional)/node_modules/@commitlint/config-conventional/lib/index.js\""

[tasks."agent:on:stop"]
run = [{ task = "fix" }, { task = "check" }]
